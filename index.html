<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roblox Studio</title>
<style>
:root{--bg:#f1f1f1;--panel:#fff;--bar:#e6e6e6;--line:#c8c8c8;--text:#1d1d1d;--muted:#6b6b6b;--accent:#0a74e6;--sel:#cfe3fb;--hover:#dcdcdc;--out:#fafafa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2b2e;--panel:#232326;--bar:#333337;--line:#47474c;--text:#e8e8ea;--muted:#9a9aa0;--accent:#4aa3ff;--sel:#1f4a7a;--hover:#3d3d42;--out:#1c1c1f}}
:root[data-theme="dark"]{--bg:#2b2b2e;--panel:#232326;--bar:#333337;--line:#47474c;--text:#e8e8ea;--muted:#9a9aa0;--accent:#4aa3ff;--sel:#1f4a7a;--hover:#3d3d42;--out:#1c1c1f}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.3 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto auto 1fr 96px}
.tabs{display:flex;gap:2px;padding:4px 8px 0;background:var(--bar)}
.tab{padding:4px 14px;border-radius:4px 4px 0 0;color:var(--muted)}
.tab.on{background:var(--panel);color:var(--text)}
.ribbon{display:flex;flex-wrap:wrap;gap:2px;padding:4px 8px;background:var(--panel);border-bottom:1px solid var(--line);align-items:flex-end}
.btn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;padding:4px 6px;border:0;border-radius:4px;background:none;color:var(--text);font:inherit;cursor:pointer}
.btn i,.mi{font-family:'Material Symbols Outlined';font-style:normal;font-weight:400;font-feature-settings:'liga';white-space:nowrap;overflow:hidden;text-transform:none;letter-spacing:normal;user-select:none}
.btn i{font-size:26px;line-height:26px;width:26px;height:26px}
.mi{display:inline-block;flex:none;font-size:17px;line-height:17px;width:17px;height:17px}
#play i{color:#2e9e4f}#stop i{color:#d6453b}#addPart i{color:#3b82c4}
.btn:hover{background:var(--hover)}
.btn.on{background:var(--sel);outline:1px solid var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:2px 6px}
.opt{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.opt label{display:flex;align-items:center;gap:4px;justify-content:space-between}
.opt input{width:44px}
input,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:2px 4px;min-width:0}
main{display:grid;grid-template-columns:1fr 280px;min-height:0}
#vp{position:relative;min-height:0;background:#8db4d8}
#vp canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:8px;bottom:6px;color:#fff;font-size:12px;text-shadow:0 1px 2px #000a;pointer-events:none}
aside{display:grid;grid-template-rows:1fr 1fr;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
.pane{display:flex;flex-direction:column;min-height:0}
.pane+.pane{border-top:1px solid var(--line)}
.pane h2{margin:0;padding:4px 8px;font-size:12px;font-weight:600;background:var(--bar)}
.body{overflow:auto;flex:1;padding:2px 0}
.row{display:flex;align-items:center;gap:4px;padding:2px 6px;cursor:default;white-space:nowrap}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.arrow{width:12px;text-align:center;color:var(--muted)}
.ico{width:12px;height:12px;border-radius:2px;background:#8a8a8a;flex:none}
.ico.ws{background:#3b82c4;border-radius:50%}
.ico.Ball{border-radius:50%;background:#7a7a7a}
.ico.Cylinder{border-radius:3px/6px}
.ico.Wedge{clip-path:polygon(0 100%,100% 100%,100% 0)}
.prop{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:4px;padding:2px 8px}
.prop>span{color:var(--muted)}
.vec{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.vec input,.prop>input:not([type=checkbox]),.prop>select{width:100%;box-sizing:border-box}
.prop input[type=color]{padding:0;height:22px}
.empty{padding:10px;color:var(--muted)}
.plus{margin-left:4px;display:none;width:18px;height:16px;border:0;border-radius:3px;background:#8f8f8f;color:#fff;font:700 14px/14px sans-serif;cursor:pointer;padding:0}
.row:hover .plus,.row.sel .plus{display:block}
.menu{position:fixed;z-index:20;width:240px;max-height:min(420px,80vh);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 14px #0005}
.menu>input{margin:6px}
.menu .list{overflow:auto;min-height:0}
.menu h3{margin:0;padding:4px 10px;font-size:12px;font-weight:400;color:var(--muted)}
.menu .row.dim{opacity:.45}.menu .row.dim:hover{opacity:.7}
.ico.Folder{background:#e0b13c}.ico.Script,.ico.LocalScript,.ico.ModuleScript{background:#4caf6a}.ico.Model{background:#d9534f}.ico.Tool{background:#8a6d3b}
.err{color:#d6453b}.warn{color:#c98a12}
.ico.svc{background:#4a90d9;border-radius:3px}.ico.Lighting{background:#f0b429;border-radius:50%}.ico.ServerScriptService,.ico.ServerStorage{background:#3aa655}.ico.ReplicatedFirst,.ico.ReplicatedStorage{background:#e8952a}.ico.StarterGui,.ico.StarterPack,.ico.StarterPlayer{background:#e0b13c}.ico.Teams,.ico.Players{background:#7a5cc7;border-radius:50%}
.btn:disabled{opacity:.4;pointer-events:none}
.badge{position:absolute;left:8px;top:8px;background:#000a;color:#fff;padding:2px 10px;border-radius:3px;font-size:12px;pointer-events:none}.badge:empty{display:none}
.center{display:flex;flex-direction:column;min-height:0;min-width:0}
.center #vp{flex:1}
#doctabs{display:flex;gap:2px;padding:4px 8px 0;background:var(--bar);overflow-x:auto;border-top:1px solid var(--line)}
.dt{display:flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;cursor:pointer;color:var(--muted);white-space:nowrap}
.dt.on{background:var(--panel);color:var(--text)}
.dt b{font-weight:400;opacity:.6}
#editor{flex:1;display:none;flex-direction:column;min-height:0;background:var(--panel)}
.edbar{display:flex;justify-content:flex-end;padding:3px 8px;border-bottom:1px solid var(--line)}
.edbar button{border:1px solid var(--line);background:var(--bar);color:var(--text);border-radius:3px;padding:2px 14px;cursor:pointer;font:inherit}
.edwrap{position:relative;flex:1;min-height:0}
#hl,#src{position:absolute;inset:0 0 0 52px;margin:0;padding:8px 10px;border:0;font:14px/20px Consolas,"Courier New",monospace;tab-size:4;white-space:pre;box-sizing:border-box}
#ln{position:absolute;left:0;top:0;bottom:0;width:52px;box-sizing:border-box;overflow:hidden;padding:8px 8px 0 0;text-align:right;white-space:pre;font:14px/20px Consolas,"Courier New",monospace;color:var(--muted);background:var(--bar);border-right:1px solid var(--line)}
#ln b{color:var(--text)}
#cl{position:absolute;left:52px;right:0;top:8px;height:20px;background:var(--hover);opacity:.45;pointer-events:none}
#src::selection{background:#0a74e655}
#hl{overflow:hidden;pointer-events:none;color:var(--text)}
#src{overflow:auto;background:transparent;color:transparent;caret-color:var(--text);resize:none;outline:none}
:root{--kw:#1a2a9a;--vg:#0b8a42;--fn:#2e7fd6;--st:#9a3d1a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--kw:#7fa0ff;--vg:#5fd08a;--fn:#6fb4ff;--st:#e0a070}}
:root[data-theme="dark"]{--kw:#7fa0ff;--vg:#5fd08a;--fn:#6fb4ff;--st:#e0a070}
.tk{color:var(--kw);font-weight:700}.tv{color:var(--vg);font-weight:700}.tn,.tc{color:var(--vg)}.ts{color:var(--st)}.tf{color:var(--fn)}
.ig{background:linear-gradient(var(--line),var(--line)) no-repeat 0 0/1px 100%}
#out{background:var(--out);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#otabs{display:flex;gap:2px;padding:3px 8px 0;background:var(--bar)}
.ot{padding:2px 14px;border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;background:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
.ot.on{background:var(--out);color:var(--text)}
.ot.new::after{content:"";display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:50%;background:var(--accent)}
#log{flex:1;overflow:auto;padding:4px 8px;font:12px/1.5 Consolas,"Courier New",monospace}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}aside{border-left:0;border-top:1px solid var(--line);grid-template-rows:none;grid-template-columns:1fr 1fr}.pane+.pane{border-top:0;border-left:1px solid var(--line)}.opt{display:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
</head>
<body>
<div id="app">
<div>
<div class="tabs"><span class="tab on">Home</span><span class="tab">Model</span><span class="tab">Script</span></div>
<div class="ribbon">
<button class="btn on" data-tool="select" title="Select (1)"><i>arrow_selector_tool</i>Select</button>
<button class="btn" data-tool="move" title="Move (2). Shift-drag moves up and down"><i>open_with</i>Move</button>
<button class="btn" data-tool="scale" title="Scale (3)"><i>zoom_out_map</i>Scale</button>
<button class="btn" data-tool="rotate" title="Rotate (4)"><i>rotate_right</i>Rotate</button>
<div class="sep"></div>
<div class="opt"><label>Move snap<input id="snapM" type="number" value="1" min="0" step="0.5"></label><label>Rotate snap<input id="snapR" type="number" value="15" min="0" step="5"></label></div>
<div class="sep"></div>
<button class="btn" id="addPart" title="Insert a part"><i>deployed_code</i>Part</button>
<select id="shape" aria-label="Part shape"><option>Block</option><option>Ball</option><option>Cylinder</option><option>Wedge</option></select>
<div class="sep"></div>
<button class="btn" id="dup" title="Duplicate (Ctrl+D)"><i>content_copy</i>Duplicate</button>
<button class="btn" id="del" title="Delete (Del)"><i>delete</i>Delete</button>
<div class="sep"></div>
<button class="btn" id="play" title="Run all Scripts"><i>play_arrow</i>Play</button>
<button class="btn" id="stop" title="Stop running scripts"><i>stop</i>Stop</button>
<div class="sep"></div>
<button class="btn" id="vClient" title="View the client"><i>laptop</i>Client</button>
<button class="btn" id="vServer" title="View the server"><i>dns</i>Server</button>
</div>
<div id="doctabs"></div>
</div>
<main>
<div class="center">
<div id="vp"><div class="hint">Right-drag: orbit. Shift + right-drag: pan. Wheel: zoom. WASD: move, Q/E: down and up.</div><div class="badge" id="badge"></div></div>
<div id="editor"><div class="edbar"><button id="runBtn">Run</button></div><div class="edwrap"><div id="ln"></div><div id="cl"></div><pre id="hl" aria-hidden="true"></pre><textarea id="src" spellcheck="false" wrap="off" aria-label="Script source"></textarea></div></div></div>
<aside>
<div class="pane"><h2>Explorer</h2><div class="body" id="explorer"></div></div>
<div class="pane"><h2>Properties</h2><div class="body" id="props"></div></div>
</aside>
</main>
<div id="out"><div id="otabs"></div><div id="log"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js"></script>
<script>
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const sig=()=>{const f=[];return{on:fn=>f.push(fn),fire:(...a)=>f.forEach(fn=>fn(...a))}};
const CH=['Client','Server','Studio','Roblox'],logs={},unread=new Set();let ch='Studio';
CH.forEach(n=>{const d=el('div');d.hidden=n!==ch;logs[n]=d;$('#log').append(d)});
const drawOut=()=>{const t=$('#otabs');t.textContent='';CH.forEach(n=>{const b=el('button','ot'+(n===ch?' on':'')+(unread.has(n)?' new':''),n);
b.onclick=()=>{ch=n;unread.delete(n);CH.forEach(k=>logs[k].hidden=k!==n);drawOut();$('#log').scrollTop=1e9};t.append(b)})};
const log=(m,c,s)=>{s=s||'Studio';logs[s].append(el('div',c,m));if(s!==ch&&!unread.has(s)){unread.add(s);drawOut()}$('#log').scrollTop=1e9};
drawOut();

/* DataModel: the single source of truth */
class Instance{constructor(cls,name,props){this.ClassName=cls;this.Name=name;this.Parent=null;this.Children=[];this.props=props||{}}}
const Model={added:sig(),removed:sig(),changed:sig(),selection:sig(),selected:null,
root:new Instance('Workspace','Workspace'),services:[],W:'edit',
add(i,p=this.root){i.W=p.W;i.Parent=p;p.Children.push(i);this.added.fire(i);return i},
remove(i){if(i.important)return;[...i.Children].forEach(c=>this.remove(c));i.Parent.Children.splice(i.Parent.Children.indexOf(i),1);if(this.selected===i)this.select(null);this.removed.fire(i)},
set(i,k,v){let old;if((k==='Position'||k==='Rotation')&&i.Children.length&&i.props[k])old=i.props[k].slice();
if(k==='Name')i.Name=v;else i.props[k]=v;this.changed.fire(i,k);if(old)this.cascade(i,k,old,v)},
cascade(i,k,old,nw){const ds=[],g=n=>n.Children.forEach(c=>{if(c.props.Position)ds.push(c);g(c)});g(i);if(!ds.length)return;
if(k==='Position'){const d=nw.map((x,j)=>x-old[j]);ds.forEach(c=>{c.props.Position=c.props.Position.map((x,j)=>x+d[j]);this.changed.fire(c,'Position')})}
else{const R=Math.PI/180,q=a=>new THREE.Quaternion().setFromEuler(new THREE.Euler(a[0]*R,a[1]*R,a[2]*R,'XYZ')),dq=q(nw).multiply(q(old).invert()),P=new THREE.Vector3(...i.props.Position);
ds.forEach(c=>{const v=new THREE.Vector3(...c.props.Position).sub(P).applyQuaternion(dq).add(P);c.props.Position=[v.x,v.y,v.z];
const e=new THREE.Euler().setFromQuaternion(dq.clone().multiply(q(c.props.Rotation||[0,0,0])),'XYZ');c.props.Rotation=[e.x/R,e.y/R,e.z/R];this.changed.fire(c,'Position');this.changed.fire(c,'Rotation')})}},
select(i){this.selected=i;this.selection.fire(i)}};
const mkPart=(shape,o)=>new Instance('Part','Part',Object.assign({Shape:shape,Position:[0,1,0],Size:[4,2,2],Rotation:[0,0,0],Color:'#a3a2a5',Anchored:true},o));

/* Renderer: draws the model, never owns it */
const vp=$('#vp'),scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,2000);
const ren=new THREE.WebGLRenderer({antialias:true});vp.prepend(ren.domElement);
scene.background=new THREE.Color(0x8db4d8);
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,.9));
const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(30,60,20);scene.add(sun);
const wedge=new THREE.Shape([new THREE.Vector2(-.5,-.5),new THREE.Vector2(.5,-.5),new THREE.Vector2(.5,.5)]);
const geos={Block:new THREE.BoxGeometry(1,1,1),Ball:new THREE.SphereGeometry(.5,24,16),
Cylinder:new THREE.CylinderGeometry(.5,.5,1,24).rotateZ(Math.PI/2),
Wedge:new THREE.ExtrudeGeometry(wedge,{depth:1,bevelEnabled:false}).translate(0,0,-.5)};
const meshes=new Map();
const outline=new THREE.LineSegments(new THREE.EdgesGeometry(geos.Block),new THREE.LineBasicMaterial({color:0x0a74e6,depthTest:false}));
outline.renderOrder=9;outline.scale.setScalar(1.003);
const sync=i=>{const m=meshes.get(i);if(!m)return;const p=i.props;if(p.Shape){m.geometry=geos[p.Shape];m.material.color.set(p.Color);m.scale.set(...p.Size)}
m.position.set(...p.Position);m.rotation.set(...p.Rotation.map(d=>d*Math.PI/180))};
const buildMesh=i=>{if(i.ClassName==='Model'){const o=new THREE.Object3D();o.userData.inst=i;meshes.set(i,o);sync(i);return}const m=new THREE.Mesh(geos[i.props.Shape],new THREE.MeshStandardMaterial({roughness:.8}));
m.userData.inst=i;scene.add(m);meshes.set(i,m);sync(i)};
Model.added.on(i=>{if((i.props.Size||i.ClassName==='Model')&&i.W===Model.W)buildMesh(i)});
Model.removed.on(i=>{const m=meshes.get(i);if(m){scene.remove(m);if(m.material)m.material.dispose();meshes.delete(i)}});
Model.changed.on(sync);
Model.selection.on(i=>{if(outline.parent)outline.parent.remove(outline);const m=meshes.get(i);if(m)m.add(outline)});

/* Camera */
const cs={yaw:.8,pitch:.5,dist:26,t:new THREE.Vector3(0,1,0)};
const place=()=>{const c=Math.cos(cs.pitch);cam.position.set(cs.t.x+cs.dist*c*Math.sin(cs.yaw),cs.t.y+cs.dist*Math.sin(cs.pitch),cs.t.z+cs.dist*c*Math.cos(cs.yaw));cam.lookAt(cs.t)};
new ResizeObserver(()=>{const w=vp.clientWidth,h=vp.clientHeight;if(!w||!h)return;ren.setSize(w,h,false);ren.setPixelRatio(devicePixelRatio);cam.aspect=w/h;cam.updateProjectionMatrix()}).observe(vp);
function loop(){moveCam();place();updateGizmo();ren.render(scene,cam);requestAnimationFrame(loop)}requestAnimationFrame(loop);

/* Tools and picking */
let tool='select',drag=null;const ray=new THREE.Raycaster(),cv=ren.domElement;
const snap=(v,s)=>s>0?Math.round(v/s)*s:v;
const setRay=e=>{const r=cv.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),cam)};
const pick=e=>{setRay(e);const h=ray.intersectObjects([...meshes.values()])[0];return h?h.object.userData.inst:null};
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drag={b:e.button,x:e.clientX,y:e.clientY};
if(e.button===0&&gizmoDown(e))return;if(e.button!==0)return;const hit=pick(e);Model.select(hit);if(!hit||tool==='select')return;
const p=hit.props;drag.i=hit;drag.p0=p.Position.slice();drag.s0=p.Size.slice();drag.r0=p.Rotation.slice();
const pl=new THREE.Plane(new THREE.Vector3(0,1,0),-p.Position[1]),v=new THREE.Vector3();setRay(e);
drag.pl=pl;drag.off=ray.ray.intersectPlane(pl,v)?[p.Position[0]-v.x,p.Position[2]-v.z]:[0,0]});
cv.addEventListener('pointermove',e=>{if(!drag)return;if(drag.h){gizmoMove(e);return}const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
if(drag.b===2||drag.b===1){if(e.shiftKey||drag.b===1){const k=cs.dist*.0022,s=Math.sin(cs.yaw),c=Math.cos(cs.yaw);cs.t.x+=(-dx*c-dy*s*Math.sin(cs.pitch))*k;cs.t.z+=(dx*s-dy*c*Math.sin(cs.pitch))*k;cs.t.y+=dy*k*Math.cos(cs.pitch)}
else{cs.yaw-=dx*.006;cs.pitch=Math.max(-1.4,Math.min(1.4,cs.pitch+dy*.006))}drag.x=e.clientX;drag.y=e.clientY;return}
const i=drag.i;if(!i)return;const sm=+$('#snapM').value,sr=+$('#snapR').value;
if(tool==='move'){const pos=drag.p0.slice(),v=new THREE.Vector3();
if(e.shiftKey)pos[1]=snap(drag.p0[1]-dy*cs.dist*.0022*1.4,sm);
else{setRay(e);if(!ray.ray.intersectPlane(drag.pl,v))return;pos[0]=snap(v.x+drag.off[0],sm);pos[2]=snap(v.z+drag.off[1],sm)}
Model.set(i,'Position',pos)}
else if(tool==='scale'){const f=Math.max(.05,1+dx/200);Model.set(i,'Size',drag.s0.map(s=>Math.max(.05,+(s*f).toFixed(2))))}
else if(tool==='rotate'){const r=drag.r0.slice();r[1]=snap(r[1]+dx*.5,sr);Model.set(i,'Rotation',r)}});
cv.addEventListener('pointerup',()=>{drag=null});
cv.addEventListener('wheel',e=>{e.preventDefault();cs.dist=Math.max(2,Math.min(400,cs.dist*(1+Math.sign(e.deltaY)*.1)))},{passive:false});

/* Gizmos: arrows to move, rings to rotate, spheres to scale */
const gMove=new THREE.Group(),gRot=new THREE.Group(),gScale=new THREE.Group(),AC=[0xe5483c,0x3fbf5a,0x3b7be5];
const gm=c=>new THREE.MeshBasicMaterial({color:c,depthTest:false,transparent:true,opacity:.95});
const gadd=(grp,mesh,u)=>{mesh.userData=u;mesh.renderOrder=10;grp.add(mesh);return mesh};
[0,1,2].forEach(a=>{const g=new THREE.Group();
gadd(g,new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,1.3,8),gm(AC[a])),{axis:a}).position.y=.75;
gadd(g,new THREE.Mesh(new THREE.ConeGeometry(.16,.4,12),gm(AC[a])),{axis:a}).position.y=1.6;
if(a===0)g.rotation.z=-Math.PI/2;if(a===2)g.rotation.x=Math.PI/2;gMove.add(g);
const tg=new THREE.TorusGeometry(2,.07,8,64);if(a===0)tg.rotateY(Math.PI/2);if(a===1)tg.rotateX(Math.PI/2);
